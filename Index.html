<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>記帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2EFE6;
    --panel:#FFFFFF;
    --ink:#20261F;
    --muted:#6F7568;
    --accent:#3E6B52;
    --accent-soft:#E4EDE6;
    --warn:#B5502E;
    --line:#E2DDCC;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .app{
    max-width:460px;
    margin:0 auto;
    padding:22px 18px 60px;
  }
  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }
  header h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  header .today{
    font-size:13px;
    color:var(--muted);
  }
  .nav-row{
    display:flex;
    gap:6px;
    margin-bottom:16px;
  }
  .nav-tab{
    flex:1;
    text-align:center;
    padding:10px;
    border-radius:12px;
    font-size:14px;
    cursor:pointer;
    border:1px solid var(--line);
    background:#FBFAF6;
    color:var(--ink);
    user-select:none;
  }
  .nav-tab.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }
  .panel{
    background:var(--panel);
    border-radius:var(--radius);
    padding:22px 20px;
    margin-bottom:16px;
    border:1px solid var(--line);
  }
  .hero .label{
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.04em;
  }
  .hero .amount{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:38px;
    line-height:1.1;
    margin:4px 0 12px;
    font-variant-numeric:tabular-nums;
  }
  .hero-list{
    border-top:1px solid var(--line);
    padding-top:8px;
  }
  .hero-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:6px 0;
  }
  .hero-row .cat{ font-weight:600; margin-right:6px; }
  .hero-row .meta{ color:var(--muted); }
  .hero-row .amt{ font-weight:600; font-variant-numeric:tabular-nums; }
  h2{
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    margin:0 0 14px;
  }
  .tab-row{
    display:flex;
    gap:6px;
    margin-bottom:16px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:8px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    border:1px solid var(--line);
    background:#FBFAF6;
    color:var(--ink);
    user-select:none;
  }
  .tab.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .section-label{
    font-size:12px;
    color:var(--muted);
    margin:14px 0 8px;
  }
  .chart-wrap{
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .chart-wrap svg{ height:auto; display:block; }
  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 10px;
    cursor:pointer;
    user-select:none;
  }
  .legend-item.off{ opacity:0.35; }
  .legend-dot{
    width:8px; height:8px; border-radius:50%; display:inline-block;
  }
  .sel-summary{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .sel-summary .sel-label{ font-size:12px; color:var(--muted); }
  .sel-summary .sel-total{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:24px;
    margin:2px 0 10px;
    font-variant-numeric:tabular-nums;
  }
  .cat-card{
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 12px;
    margin-bottom:8px;
    cursor:pointer;
    user-select:none;
  }
  .cat-card .cat-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .cat-card .cat-left{
    display:flex; align-items:center; gap:8px;
  }
  .cat-card .cat-name{ font-size:14px; font-weight:600; }
  .cat-card .cat-amt{ font-size:14px; font-weight:600; font-variant-numeric:tabular-nums; }
  .cat-card .chev{ font-size:12px; color:var(--muted); margin-left:6px; }
  .cat-items{
    display:none;
    margin-top:10px;
    border-top:1px solid var(--line);
    padding-top:6px;
  }
  .cat-card.open .cat-items{ display:block; }
  .cat-item-row{
    display:flex; justify-content:space-between;
    font-size:12px; padding:5px 0;
  }
  .cat-item-row .d{ color:var(--muted); margin-left:6px; }
  .cat-item-row .v{ font-weight:600; font-variant-numeric:tabular-nums; }
  .cat-rest{ font-size:11px; color:var(--muted); padding-top:4px; }
  .daybar-chart{
    display:flex;
    align-items:flex-end;
    gap:6px;
    height:90px;
    margin-top:6px;
  }
  .daybar-col{
    flex:1;
    height:100%;
    display:flex;
    flex-direction:column-reverse;
  }
  .daybar-bar{
    width:100%;
    display:flex;
    flex-direction:column-reverse;
    border-radius:3px 3px 0 0;
    overflow:hidden;
  }
  .daybar-empty{
    width:100%;
    height:3px;
    background:var(--accent-soft);
    border-radius:2px;
  }
  .daybar-totals, .daybar-labels{
    display:flex;
    gap:6px;
  }
  .daybar-totals div, .daybar-labels div{
    flex:1;
    text-align:center;
    font-size:10px;
  }
  .daybar-totals div{
    font-weight:600;
    margin-top:4px;
  }
  .daybar-labels div{
    color:var(--muted);
    line-height:1.4;
    margin-top:2px;
  }
  .daybar-legend{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .daybar-legend .legend-item{
    border:none;
    padding:0;
    cursor:default;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:12px; color:var(--muted); margin-bottom:6px;
  }
  input[type=number], input[type=text]{
    width:100%;
    padding:11px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#FBFAF6;
    font-family:'Inter',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  input[type=number]{
    font-family:'Fraunces',serif;
    font-size:22px;
    font-weight:600;
  }
  input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#FBFAF6;
    font-size:13px;
    color:var(--ink);
    cursor:pointer;
    user-select:none;
  }
  .chip.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .method-row{ display:flex; gap:8px; }
  .method-row .chip{ flex:1; text-align:center; }
  button.submit{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--ink);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    margin-top:4px;
  }
  button.submit:disabled{ background:var(--muted); cursor:default; }
  .status-msg{ font-size:13px; margin-top:10px; color:var(--muted); }
  .status-msg.error{ color:var(--warn); }
  .status-msg.ok{ color:var(--accent); }
  .entry-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .entry-row:last-child{ border-bottom:none; }
  .entry-row .left .cat{ font-weight:600; }
  .entry-row .left .meta{ font-size:12px; color:var(--muted); margin-top:2px; }
  .entry-row .amount{ font-variant-numeric:tabular-nums; font-weight:600; }
  .empty-note{ color:var(--muted); font-size:13px; }
  .pagination{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .pagination button{
    border:1px solid var(--line);
    background:#FBFAF6;
    color:var(--ink);
    border-radius:8px;
    padding:6px 12px;
    font-size:13px;
    cursor:pointer;
  }
  .pagination button:disabled{ color:var(--muted); cursor:default; opacity:0.5; }
  .pagination .page-info{ font-size:12px; color:var(--muted); }
  .comment-section{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .comment-section .c-label{
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .comment-text{
    font-size:13px;
    line-height:1.6;
    background:#FBFAF6;
    border-radius:10px;
    padding:10px 12px;
    white-space:pre-wrap;
  }
  .comment-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:6px;
  }
  .comment-meta .c-time{
    font-size:11px;
    color:var(--muted);
  }
  .comment-btn{
    border:1px solid var(--line);
    background:#FBFAF6;
    color:var(--ink);
    border-radius:8px;
    padding:5px 14px;
    font-size:12px;
    cursor:pointer;
  }
  .comment-btn.primary{
    border:none;
    background:var(--ink);
    color:#fff;
    font-weight:600;
    padding:6px 16px;
  }
  .comment-btn.primary:disabled{
    background:var(--muted);
    cursor:default;
  }
  .comment-btn.cancel{ color:var(--muted); }
  textarea.comment-input{
    width:100%;
    min-height:64px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:#FBFAF6;
    resize:vertical;
  }
  textarea.comment-input:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  .comment-actions{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin-top:8px;
  }
  .comment-status{
    font-size:11px;
    margin-top:4px;
    text-align:right;
    color:var(--accent);
  }
  .comment-status.error{ color:var(--warn); }
  .setup-screen{
    max-width:400px;
    margin:60px auto 0;
    padding:0 18px;
  }
  .setup-screen h1{
    font-family:'Fraunces',serif;
    font-size:24px;
    margin-bottom:6px;
  }
  .setup-screen p{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    margin-bottom:20px;
  }
  .setup-link{
    display:inline-block;
    margin-top:10px;
    font-size:12px;
    color:var(--muted);
    cursor:pointer;
    text-decoration:underline;
  }
</style>
</head>
<body>

<div id="setupScreen" class="setup-screen" style="display:none;">
  <h1>記帳</h1>
  <p>第一次使用，請貼上 Google Apps Script 的網址跟你自己設定的密碼。這些資料只會存在這個瀏覽器裡，不會上傳到任何地方，之後打開不用再輸入一次。</p>
  <div class="panel">
    <div class="field">
      <label>Apps Script 網址（.../exec 結尾）</label>
      <input type="text" id="setupUrl" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div class="field">
      <label>密碼（跟 Apps Script 裡 TOKEN 設的一樣）</label>
      <input type="text" id="setupToken" placeholder="你在 Apps Script 設的那串亂碼">
    </div>
    <button class="submit" id="setupSaveBtn">儲存並開始使用</button>
    <div class="status-msg" id="setupStatusMsg"></div>
  </div>
</div>

<div id="mainApp" class="app" style="display:none;">

  <header>
    <h1>記帳</h1>
    <div class="today" id="todayLabel"></div>
  </header>

  <div class="nav-row">
    <div class="nav-tab active" id="navRecord">記帳</div>
    <div class="nav-tab" id="navAnalysis">分析</div>
  </div>

  <div id="pageRecord">

    <div class="panel hero">
      <div class="label">今日花費</div>
      <div class="amount" id="todayTotal">NT$ 0</div>
      <div class="hero-list" id="todayList"></div>
    </div>

    <div class="panel add-form">
      <h2>新增一筆</h2>
      <div class="field">
        <label>金額</label>
        <input type="number" id="amountInput" inputmode="decimal" placeholder="0">
      </div>
      <div class="field">
        <label>分類</label>
        <div class="chip-row" id="categoryChips"></div>
      </div>
      <div class="field">
        <label>付款方式</label>
        <div class="method-row" id="methodChips"></div>
      </div>
      <div class="field">
        <label>備註（選填）</label>
        <input type="text" id="noteInput" placeholder="例如：和同事吃午餐">
      </div>
      <button class="submit" id="submitBtn">記下這筆</button>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="panel weekbar">
      <h2>本週每日花費</h2>
      <div class="daybar-chart" id="daybarChart"></div>
      <div class="daybar-totals" id="daybarTotals"></div>
      <div class="daybar-labels" id="daybarLabels"></div>
      <div class="daybar-legend" id="daybarLegend"></div>
    </div>

    <div class="panel recent">
      <h2>最近紀錄</h2>
      <div id="recentList"></div>
      <div class="pagination" id="pagination"></div>
    </div>

  </div>

  <div id="pageAnalysis" style="display:none;">

    <div class="panel">
      <h2>花費趨勢</h2>
      <div class="tab-row">
        <div class="tab active" id="tabWeek">週（近 12 週）</div>
        <div class="tab" id="tabMonth">月（近 6 個月）</div>
      </div>
      <div class="chart-wrap" id="chartWrap"></div>
      <div class="legend" id="legend"></div>
      <div class="sel-summary">
        <div class="sel-label" id="selLabel"></div>
        <div class="sel-total" id="selTotal"></div>
        <div id="catCards"></div>
        <div class="comment-section">
          <div class="c-label">本期備註</div>
          <div id="commentView" style="display:none;">
            <div class="comment-text" id="commentText"></div>
            <div class="comment-meta">
              <span class="c-time" id="commentTime"></span>
              <button class="comment-btn" id="commentEditBtn">編輯</button>
            </div>
          </div>
          <div id="commentEdit" style="display:none;">
            <textarea class="comment-input" id="commentInput" placeholder="這期有什麼特別的花費原因嗎？（選填）"></textarea>
            <div class="comment-actions">
              <button class="comment-btn cancel" id="commentCancelBtn" style="display:none;">取消</button>
              <button class="comment-btn primary" id="commentSaveBtn">儲存</button>
            </div>
            <div class="comment-status" id="commentStatus"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="setup-link" id="resetLink">重設連線設定</div>

</div>

<script>
const CATEGORIES = ["餐飲","交通","娛樂","住宿","生活雜支","學習","其他"];
const METHODS = ["現金","金融卡"];
const CAT_COLORS = {
  "餐飲":"#E05A33",
  "交通":"#3B7BD4",
  "娛樂":"#C94F8E",
  "住宿":"#E0A63A",
  "生活雜支":"#1FA396",
  "學習":"#8A64D6",
  "其他":"#9A9284"
};
const FALLBACK_COLOR = "#8C8577";

let entries = [];
let comments = {};
let selectedCategory = CATEGORIES[0];
let selectedMethod = METHODS[0];
let currentView = 'week';
let selectedBucketIdx = null;
let focusCats = new Set();
let recentPage = 1;
const RECENT_PAGE_SIZE = 10;

let SCRIPT_URL = localStorage.getItem('expenseScriptUrl') || '';
let TOKEN = localStorage.getItem('expenseToken') || '';

const el = (id) => document.getElementById(id);
const catColor = (c) => CAT_COLORS[c] || FALLBACK_COLOR;

function pad(n){ return String(n).padStart(2,'0'); }

function taipeiParts(ms){
  const shifted = new Date((ms !== undefined ? ms : Date.now()) + 8*3600*1000);
  return {
    y: shifted.getUTCFullYear(),
    m: shifted.getUTCMonth()+1,
    day: shifted.getUTCDate(),
    h: shifted.getUTCHours(),
    min: shifted.getUTCMinutes(),
    sec: shifted.getUTCSeconds(),
    weekday: shifted.getUTCDay()
  };
}

function taipeiTimestampString(){
  const p = taipeiParts();
  return p.y+'-'+pad(p.m)+'-'+pad(p.day)+' '+pad(p.h)+':'+pad(p.min)+':'+pad(p.sec);
}

function dateFromYMD(y,m,d){ return new Date(Date.UTC(y, m-1, d)); }
function addDays(d,n){ return new Date(d.getTime() + n*86400000); }
function ymdStr(d){ return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate()); }
function mdStr(d){ return (d.getUTCMonth()+1)+'/'+d.getUTCDate(); }

function fmt(n){
  return "NT$ " + Math.round(n).toLocaleString('zh-TW');
}

function withToken(url){
  const sep = url.indexOf('?') === -1 ? '?' : '&';
  return url + sep + 'token=' + encodeURIComponent(TOKEN);
}

function dateOnly(e){ return (e.timestamp || '').slice(0,10); }
function timeOnly(e){ return (e.timestamp || '').slice(11,16); }
function mdStrFromString(ts){
  return parseInt(ts.slice(5,7),10) + '/' + parseInt(ts.slice(8,10),10);
}

function initSetupScreen(){
  el('setupSaveBtn').onclick = () => {
    const url = el('setupUrl').value.trim();
    const token = el('setupToken').value.trim();
    const msg = el('setupStatusMsg');
    if(!url || !token){
      msg.textContent = '網址跟密碼都要填喔。';
      msg.className = 'status-msg error';
      return;
    }
    localStorage.setItem('expenseScriptUrl', url);
    localStorage.setItem('expenseToken', token);
    SCRIPT_URL = url;
    TOKEN = token;
    el('setupScreen').style.display = 'none';
    el('mainApp').style.display = 'block';
    initUI();
  };
}

function initUI(){
  const p = taipeiParts();
  const wLabel = ["日","一","二","三","四","五","六"][p.weekday];
  el('todayLabel').textContent = p.m + '月' + p.day + '日週' + wLabel;

  const catBox = el('categoryChips');
  CATEGORIES.forEach(cat => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (cat === selectedCategory ? ' active' : '');
    chip.textContent = cat;
    chip.onclick = () => {
      selectedCategory = cat;
      [...catBox.children].forEach(c => c.classList.toggle('active', c.textContent === cat));
    };
    catBox.appendChild(chip);
  });

  const methodBox = el('methodChips');
  METHODS.forEach(m => {
    const chip = document.createElement('div');
    chip.className = 'chip' + (m === selectedMethod ? ' active' : '');
    chip.textContent = m;
    chip.onclick = () => {
      selectedMethod = m;
      [...methodBox.children].forEach(c => c.classList.toggle('active', c.textContent === m));
    };
    methodBox.appendChild(chip);
  });

  el('submitBtn').onclick = submitEntry;
  el('navRecord').onclick = () => switchPage('record');
  el('navAnalysis').onclick = () => switchPage('analysis');
  el('tabWeek').onclick = () => setView('week');
  el('tabMonth').onclick = () => setView('month');
  el('resetLink').onclick = () => {
    if(confirm('確定要清除已儲存的網址跟密碼嗎？清除後要重新輸入一次。')){
      localStorage.removeItem('expenseScriptUrl');
      localStorage.removeItem('expenseToken');
      location.reload();
    }
  };

  loadEntries();
}

function switchPage(page){
  el('navRecord').classList.toggle('active', page === 'record');
  el('navAnalysis').classList.toggle('active', page === 'analysis');
  el('pageRecord').style.display = page === 'record' ? 'block' : 'none';
  el('pageAnalysis').style.display = page === 'analysis' ? 'block' : 'none';
  if(page === 'analysis') renderAnalysis();
}

function setView(v){
  currentView = v;
  selectedBucketIdx = null;
  el('tabWeek').classList.toggle('active', v === 'week');
  el('tabMonth').classList.toggle('active', v === 'month');
  renderAnalysis();
}

async function loadEntries(){
  try{
    const res = await fetch(withToken(SCRIPT_URL));
    const json = await res.json();
    if(json && json.error){
      el('statusMsg').textContent = '密碼或網址不正確，請點下方「重設連線設定」重新輸入。';
      el('statusMsg').className = 'status-msg error';
      return;
    }
    if(Array.isArray(json)){
      entries = json;
      comments = {};
    } else {
      entries = json.entries || [];
      comments = json.comments || {};
    }
    renderRecordPage();
    if(el('pageAnalysis').style.display !== 'none') renderAnalysis();
  }catch(err){
    el('statusMsg').textContent = '讀取資料失敗，請確認網址是否正確，或稍後再試一次。';
    el('statusMsg').className = 'status-msg error';
  }
}

function renderRecordPage(){
  const p = taipeiParts();
  const today = ymdStr(dateFromYMD(p.y, p.m, p.day));
  const todayEntries = entries.filter(e => dateOnly(e) === today).sort((a,b) => b.timestamp.localeCompare(a.timestamp));
  const todayTotal = todayEntries.reduce((s,e)=>s+Number(e.amount||0),0);
  el('todayTotal').textContent = fmt(todayTotal);
  const listBox = el('todayList');
  listBox.innerHTML = '';
  if(todayEntries.length === 0){
    listBox.innerHTML = '<div class="empty-note">今天還沒有花費紀錄。</div>';
  } else {
    todayEntries.forEach(e => {
      const row = document.createElement('div');
      row.className = 'hero-row';
      row.innerHTML =
        '<div><span class="cat">' + e.category + '</span><span class="meta">' + timeOnly(e) + (e.note ? ' · ' + e.note : '') + '</span></div>' +
        '<div class="amt">' + fmt(e.amount) + '</div>';
      listBox.appendChild(row);
    });
  }
  renderWeekBars();
  renderRecentList();
}

function renderWeekBars(){
  const p = taipeiParts();
  const todayObj = dateFromYMD(p.y, p.m, p.day);
  const weekday = todayObj.getUTCDay();
  const monday = addDays(todayObj, weekday === 0 ? -6 : -(weekday - 1));
  const WEEKDAY_LABELS = ["一","二","三","四","五","六","日"];

  const buckets = [];
  for(let i=0;i<7;i++){
    const d = addDays(monday, i);
    const ds = ymdStr(d);
    const dayEntries = entries.filter(e => dateOnly(e) === ds);
    const cats = {};
    dayEntries.forEach(e => {
      cats[e.category] = (cats[e.category] || 0) + Number(e.amount || 0);
    });
    buckets.push({ label: WEEKDAY_LABELS[i] + '<br>' + mdStr(d), cats });
  }

  const totals = buckets.map(b => Object.values(b.cats).reduce((s,v)=>s+v,0));
  const maxTotal = Math.max(...totals, 1);
  const chart = el('daybarChart');
  const totalsBox = el('daybarTotals');
  const labelsBox = el('daybarLabels');
  const legend = el('daybarLegend');
  chart.innerHTML = ''; totalsBox.innerHTML = ''; labelsBox.innerHTML = ''; legend.innerHTML = '';
  const usedCats = new Set();

  buckets.forEach((b, i) => {
    const t = totals[i];
    const col = document.createElement('div');
    col.className = 'daybar-col';
    if(t === 0){
      const empty = document.createElement('div');
      empty.className = 'daybar-empty';
      col.appendChild(empty);
    } else {
      const barH = Math.round((t / maxTotal) * 100);
      const bar = document.createElement('div');
      bar.className = 'daybar-bar';
      bar.style.height = barH + '%';
      Object.entries(b.cats).forEach(([cat, val]) => {
        usedCats.add(cat);
        const seg = document.createElement('div');
        seg.style.height = Math.round((val/t)*100) + '%';
        seg.style.background = catColor(cat);
        bar.appendChild(seg);
      });
      col.appendChild(bar);
    }
    chart.appendChild(col);

    const tl = document.createElement('div');
    tl.textContent = t;
    totalsBox.appendChild(tl);

    const ll = document.createElement('div');
    ll.innerHTML = b.label;
    labelsBox.appendChild(ll);
  });

  CATEGORIES.forEach(cat => {
    if(!usedCats.has(cat)) return;
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = '<span class="legend-dot" style="background:' + catColor(cat) + ';"></span>' + cat;
    legend.appendChild(item);
  });
}

function renderRecentList(){
  const recentBox = el('recentList');
  const pager = el('pagination');
  recentBox.innerHTML = '';
  const sorted = [...entries].sort((a,b) => (b.timestamp||'').localeCompare(a.timestamp||''));
  const totalPages = Math.max(1, Math.ceil(sorted.length / RECENT_PAGE_SIZE));
  if(recentPage > totalPages) recentPage = totalPages;
  const pageItems = sorted.slice((recentPage-1)*RECENT_PAGE_SIZE, recentPage*RECENT_PAGE_SIZE);

  if(sorted.length === 0){
    recentBox.innerHTML = '<div class="empty-note">尚無紀錄。</div>';
    pager.innerHTML = '';
    return;
  }

  pageItems.forEach(e => {
    const ts = e.timestamp || '';
    const display = ts.length >= 16 ? (mdStrFromString(ts) + ' ' + ts.slice(11,16)) : ts;
    const row = document.createElement('div');
    row.className = 'entry-row';
    row.innerHTML =
      '<div class="left"><div class="cat">' + e.category + '</div>' +
      '<div class="meta">' + display + ' · ' + e.method + (e.note ? ' · ' + e.note : '') + '</div></div>' +
      '<div class="amount">' + fmt(e.amount) + '</div>';
    recentBox.appendChild(row);
  });

  pager.innerHTML = '';
  const prevBtn = document.createElement('button');
  prevBtn.textContent = '‹ 上一頁';
  prevBtn.disabled = recentPage <= 1;
  prevBtn.onclick = () => { recentPage -= 1; renderRecentList(); };
  const info = document.createElement('span');
  info.className = 'page-info';
  info.textContent = '第 ' + recentPage + ' 頁 / 共 ' + totalPages + ' 頁';
  const nextBtn = document.createElement('button');
  nextBtn.textContent = '下一頁 ›';
  nextBtn.disabled = recentPage >= totalPages;
  nextBtn.onclick = () => { recentPage += 1; renderRecentList(); };
  pager.appendChild(prevBtn);
  pager.appendChild(info);
  pager.appendChild(nextBtn);
}

function buildBuckets(){
  const p = taipeiParts();
  const todayObj = dateFromYMD(p.y, p.m, p.day);
  const buckets = [];
  if(currentView === 'week'){
    const weekday = todayObj.getUTCDay();
    const monday = addDays(todayObj, weekday === 0 ? -6 : -(weekday - 1));
    for(let i = 11; i >= 0; i--){
      const start = addDays(monday, -7*i);
      const end = addDays(start, 6);
      buckets.push({
        start: ymdStr(start),
        end: ymdStr(end),
        label: 'WB' + pad(start.getUTCMonth()+1) + pad(start.getUTCDate()),
        longLabel: mdStr(start) + ' - ' + mdStr(end)
      });
    }
  } else {
    for(let i = 5; i >= 0; i--){
      let y = p.y, m = p.m - i;
      while(m < 1){ m += 12; y -= 1; }
      const start = dateFromYMD(y, m, 1);
      const end = addDays(dateFromYMD(y, m+1, 1), -1);
      buckets.push({
        start: ymdStr(start),
        end: ymdStr(end),
        label: m + '月',
        longLabel: y + '年' + m + '月'
      });
    }
  }
  return buckets;
}

function entriesInRange(startYmd, endYmd){
  return entries.filter(e => {
    const d = dateOnly(e);
    return d >= startYmd && d <= endYmd;
  });
}

function renderAnalysis(){
  const buckets = buildBuckets();
  if(selectedBucketIdx === null || selectedBucketIdx >= buckets.length){
    selectedBucketIdx = buckets.length - 1;
  }

  const catSeries = {};
  const usedCats = [];
  buckets.forEach((b, i) => {
    const list = entriesInRange(b.start, b.end);
    list.forEach(e => {
      const c = e.category;
      if(!catSeries[c]){
        catSeries[c] = new Array(buckets.length).fill(0);
        usedCats.push(c);
      }
      catSeries[c][i] += Number(e.amount || 0);
    });
  });
  usedCats.sort((a,b) => {
    const ia = CATEGORIES.indexOf(a), ib = CATEGORIES.indexOf(b);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  });

  renderChart(buckets, catSeries, usedCats);
  renderLegend(usedCats);
  renderSelected(buckets);
}

function renderChart(buckets, catSeries, usedCats){
  const n = buckets.length;
  const isWeek = currentView === 'week';
  const stepW = isWeek ? 48 : 0;
  const padL = 28, padR = 28, padT = 26, padB = 48;
  const W = isWeek ? (padL + padR + stepW * (n - 1)) : 340;
  const H = 204;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const xAt = (i) => padL + (n === 1 ? plotW/2 : (i / (n-1)) * plotW);

  const anyFocus = focusCats.size > 0;
  let maxVal = 1;
  usedCats.forEach(c => {
    catSeries[c].forEach(v => { if(v > maxVal) maxVal = v; });
  });
  const yAt = (v) => padT + plotH - (v / maxVal) * plotH;

  let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:' + (isWeek ? W + 'px' : '100%') + ';" xmlns="http://www.w3.org/2000/svg">';

  const selX = xAt(selectedBucketIdx);
  const bandW = n > 1 ? plotW/(n-1) : plotW;
  svg += '<rect x="' + (selX - bandW/2) + '" y="' + padT + '" width="' + bandW + '" height="' + plotH + '" fill="#EDE9DB"/>';

  svg += '<line x1="' + padL + '" y1="' + (padT+plotH) + '" x2="' + (W-padR) + '" y2="' + (padT+plotH) + '" stroke="#E2DDCC" stroke-width="1"/>';

  const drawOrder = [...usedCats].sort((a,b) => (focusCats.has(a)?1:0) - (focusCats.has(b)?1:0));
  drawOrder.forEach(c => {
    const focused = focusCats.has(c);
    const op = anyFocus ? (focused ? 1 : 0.15) : 0.35;
    const wd = focused ? 2.6 : 2;
    const pts = catSeries[c].map((v,i) => xAt(i).toFixed(1) + ',' + yAt(v).toFixed(1)).join(' ');
    svg += '<polyline points="' + pts + '" fill="none" stroke="' + catColor(c) + '" stroke-width="' + wd + '" stroke-opacity="' + op + '" stroke-linejoin="round" stroke-linecap="round"/>';
  });

  if(anyFocus){
    drawOrder.forEach(c => {
      if(!focusCats.has(c)) return;
      catSeries[c].forEach((v, i) => {
        const r = i === selectedBucketIdx ? 4 : 2.8;
        svg += '<circle cx="' + xAt(i).toFixed(1) + '" cy="' + yAt(v).toFixed(1) + '" r="' + r + '" fill="' + catColor(c) + '"/>';
        const txt = Math.round(v).toLocaleString('zh-TW');
        const tw = txt.length * 5.2 + 8;
        const tx = xAt(i), ty = yAt(v) - 8;
        svg += '<rect x="' + (tx - tw/2).toFixed(1) + '" y="' + (ty - 9).toFixed(1) + '" width="' + tw.toFixed(1) + '" height="13" rx="4" fill="#FFFFFF" fill-opacity="0.92" stroke="#E2DDCC" stroke-width="0.6"/>';
        svg += '<text x="' + tx.toFixed(1) + '" y="' + (ty + 1).toFixed(1) + '" text-anchor="middle" font-size="8.5" font-weight="600" fill="' + catColor(c) + '" font-family="Inter,sans-serif">' + txt + '</text>';
      });
    });
  } else {
    usedCats.forEach(c => {
      const v = catSeries[c][selectedBucketIdx];
      svg += '<circle cx="' + xAt(selectedBucketIdx).toFixed(1) + '" cy="' + yAt(v).toFixed(1) + '" r="3.4" fill="' + catColor(c) + '" fill-opacity="0.5"/>';
    });
  }

  const bucketTotals = buckets.map((b, i) => {
    let s = 0;
    usedCats.forEach(c => { s += catSeries[c][i]; });
    return s;
  });

  buckets.forEach((b, i) => {
    const lx = xAt(i).toFixed(1);
    svg += '<text x="' + lx + '" y="' + (H-26) + '" text-anchor="middle" font-size="9" fill="#6F7568" font-family="Inter,sans-serif">' + b.label + '</text>';
    svg += '<text x="' + lx + '" y="' + (H-12) + '" text-anchor="middle" font-size="8.5" font-weight="600" fill="#20261F" font-family="Inter,sans-serif">' + Math.round(bucketTotals[i]).toLocaleString('zh-TW') + '</text>';
    const key = periodKeyOf(b);
    if(comments[key] && comments[key].comment){
      const dotX = xAt(i) + b.label.length * 2.5 + 6;
      svg += '<circle cx="' + dotX.toFixed(1) + '" cy="' + (H-29) + '" r="1.8" fill="#3E6B52"/>';
    }
  });

  buckets.forEach((b, i) => {
    const x0 = i === 0 ? 0 : (xAt(i) - bandW/2);
    const w0 = i === 0 ? (xAt(0) + bandW/2) : bandW;
    svg += '<rect x="' + x0.toFixed(1) + '" y="0" width="' + w0.toFixed(1) + '" height="' + H + '" fill="transparent" style="cursor:pointer" onclick="selectBucket(' + i + ')"/>';
  });

  svg += '</svg>';
  const wrap = el('chartWrap');
  const prevScroll = wrap.scrollLeft;
  const hadContent = wrap.dataset.view === currentView;
  wrap.innerHTML = svg;
  wrap.dataset.view = currentView;
  if(isWeek){
    wrap.scrollLeft = hadContent ? prevScroll : wrap.scrollWidth;
  }
}

function selectBucket(i){
  selectedBucketIdx = i;
  renderAnalysis();
}

function renderLegend(usedCats){
  const legend = el('legend');
  legend.innerHTML = '';
  usedCats.forEach(cat => {
    const on = focusCats.has(cat);
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.style.borderColor = on ? catColor(cat) : '';
    item.style.background = on ? '#fff' : '';
    item.style.fontWeight = on ? '600' : '';
    item.style.color = on ? 'var(--ink)' : '';
    item.innerHTML = '<span class="legend-dot" style="background:' + catColor(cat) + ';"></span>' + cat;
    item.onclick = () => {
      if(focusCats.has(cat)) focusCats.delete(cat); else focusCats.add(cat);
      renderAnalysis();
    };
    legend.appendChild(item);
  });
}

function periodKeyOf(bucket){
  return currentView === 'week' ? ('W' + bucket.start) : ('M' + bucket.start.slice(0,7));
}

function renderSelected(buckets){
  const b = buckets[selectedBucketIdx];
  const list = entriesInRange(b.start, b.end);
  const total = list.reduce((s,e)=>s+Number(e.amount||0),0);

  el('selLabel').textContent = (currentView === 'week' ? b.label + '（' + b.longLabel + '）' : b.longLabel) + ' 合計';
  el('selTotal').textContent = fmt(total);

  const catTotals = {};
  list.forEach(e => {
    catTotals[e.category] = (catTotals[e.category] || 0) + Number(e.amount || 0);
  });
  const sorted = Object.entries(catTotals).sort((a,b2) => b2[1]-a[1]);

  const box = el('catCards');
  box.innerHTML = '';
  if(sorted.length === 0){
    box.innerHTML = '<div class="empty-note">這段期間沒有花費紀錄。</div>';
    renderCommentSection(b);
    return;
  }

  sorted.forEach(([cat, val]) => {
    const card = document.createElement('div');
    card.className = 'cat-card';
    const items = list.filter(e => e.category === cat).sort((a,b2) => Number(b2.amount) - Number(a.amount));
    const top5 = items.slice(0,5);
    const rest = items.slice(5);
    const restSum = rest.reduce((s,e)=>s+Number(e.amount||0),0);

    let inner =
      '<div class="cat-head">' +
        '<div class="cat-left"><span class="legend-dot" style="background:' + catColor(cat) + ';"></span><span class="cat-name">' + cat + '</span></div>' +
        '<div><span class="cat-amt">' + fmt(val) + '</span><span class="chev">▾</span></div>' +
      '</div>' +
      '<div class="cat-items">';
    top5.forEach(e => {
      inner += '<div class="cat-item-row"><span>' + (e.note || '（無備註）') + '<span class="d">' + mdStrFromString(e.timestamp || '') + '</span></span><span class="v">' + Math.round(Number(e.amount||0)).toLocaleString('zh-TW') + '</span></div>';
    });
    if(rest.length > 0){
      inner += '<div class="cat-rest">其餘 ' + rest.length + ' 筆共 ' + fmt(restSum) + '</div>';
    }
    inner += '</div>';

    card.innerHTML = inner;
    card.onclick = () => card.classList.toggle('open');
    box.appendChild(card);
  });

  renderCommentSection(b);
}

function fmtCommentTime(ts){
  if(!ts || ts.length < 16) return '';
  return '最後編輯 ' + mdStrFromString(ts) + ' ' + ts.slice(11,16);
}

function renderCommentSection(bucket){
  const key = periodKeyOf(bucket);
  const data = comments[key];
  const hasComment = data && data.comment;
  const view = el('commentView');
  const edit = el('commentEdit');
  el('commentStatus').textContent = '';

  if(hasComment){
    view.style.display = 'block';
    edit.style.display = 'none';
    el('commentText').textContent = data.comment;
    el('commentTime').textContent = fmtCommentTime(data.updatedAt);
    el('commentEditBtn').onclick = () => {
      view.style.display = 'none';
      edit.style.display = 'block';
      el('commentInput').value = data.comment;
      el('commentCancelBtn').style.display = 'inline-block';
      el('commentSaveBtn').textContent = '更新送出';
      el('commentCancelBtn').onclick = () => renderCommentSection(bucket);
      el('commentSaveBtn').onclick = () => saveComment(key, bucket);
    };
  } else {
    view.style.display = 'none';
    edit.style.display = 'block';
    el('commentInput').value = '';
    el('commentCancelBtn').style.display = 'none';
    el('commentSaveBtn').textContent = '儲存';
    el('commentSaveBtn').onclick = () => saveComment(key, bucket);
  }
}

async function saveComment(key, bucket){
  const text = el('commentInput').value.trim();
  const btn = el('commentSaveBtn');
  const status = el('commentStatus');
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = '送出中…';
  status.textContent = '';
  status.className = 'comment-status';

  try{
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'saveComment', periodKey: key, comment: text, token: TOKEN })
    });
    if(text){
      comments[key] = { comment: text, updatedAt: taipeiTimestampString() };
    } else {
      delete comments[key];
    }
    renderAnalysis();
  }catch(err){
    status.textContent = '儲存失敗，請檢查網路後再試一次。';
    status.className = 'comment-status error';
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

async function submitEntry(){
  const amount = parseFloat(el('amountInput').value);
  const note = el('noteInput').value.trim();
  const statusMsg = el('statusMsg');

  if(!amount || amount <= 0){
    statusMsg.textContent = '請輸入有效的金額。';
    statusMsg.className = 'status-msg error';
    return;
  }

  const payload = {
    timestamp: taipeiTimestampString(),
    amount, category: selectedCategory, method: selectedMethod, note, token: TOKEN
  };
  const btn = el('submitBtn');
  btn.disabled = true;
  btn.textContent = '記錄中…';

  try{
    await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    entries.push(payload);
    recentPage = 1;
    renderRecordPage();
    el('amountInput').value = '';
    el('noteInput').value = '';
    statusMsg.textContent = '已記下這筆。';
    statusMsg.className = 'status-msg ok';
    loadEntries();
  }catch(err){
    statusMsg.textContent = '新增失敗，請檢查網路連線後再試一次。';
    statusMsg.className = 'status-msg error';
  }finally{
    btn.disabled = false;
    btn.textContent = '記下這筆';
  }
}

initSetupScreen();
if(SCRIPT_URL && TOKEN){
  el('mainApp').style.display = 'block';
  initUI();
} else {
  el('setupScreen').style.display = 'block';
}
</script>
